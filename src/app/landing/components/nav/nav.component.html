<nav
  class="fixed top-0 left-0 right-0 z-[9999] h-16 border-b border-slate-200/60 bg-white/95 backdrop-blur-md"
>
  <div class="flex justify-between">
    <!-- LEFT: LOGO -->
    <a
      routerLink="/"
      class="flex shrink-0 items-center gap-2 select-none cursor-pointer"
      aria-label="Go to landing page"
    >
      <div
        class="relative flex h-10 w-12 items-center justify-center rounded-full bg-gradient-to-br from-yellow-400 to-sky-500 shadow-lg"
      >
        <span class="font-bold text-white">&lt; // &gt;</span>
        <div
          class="absolute -right-1 -top-1 h-4 w-4 rounded-full bg-yellow-400"
        ></div>
      </div>

      <div class="text-2xl font-extrabold tracking-tight">
        <span class="text-gray-400">skill</span>
        <span class="text-sky-500">Up</span>
      </div>
    </a>

    <!-- RIGHT: NAV ITEMS -->
    <div class="z-10 flex items-center gap-5 font-semibold text-gray-500">
      <div
        class="relative"
        (mouseenter)="cancelClose()"
        (mouseleave)="scheduleClose()"
      >
        <button
          type="button"
          (click)="toggleMenu($event)"
          class="flex items-center gap-2 rounded-xl px-3 py-2 text-[15px] font-semibold transition-all duration-300 ease-out hover:text-sky-500"
          [ngClass]="isOpen ? 'text-sky-500' : 'text-slate-600'"
        >
          <span>Learning Path</span>
          <app-dropdown [isOpen]="isOpen"></app-dropdown>
        </button>

        <div
          *ngIf="isOpen"
          (mouseenter)="cancelClose()"
          (mouseleave)="scheduleClose()"
          (click)="$event.stopPropagation()"
          class="dropdown-shell absolute top-full mt-1 w-[980px] rounded-[28px] border border-slate-200/70 bg-white/95 px-3 pt-3 pb-6 backdrop-blur-2xl transition-all duration-300 ease-out"
        >
          <div class="flex items-start">
            <!-- Left panel -->
            <div
              class="w-[235px] shrink-0 border-r border-slate-100 p-4 transition-all duration-300 ease-out"
            >
              <div class="px-3 pb-3 pt-2">
                <p
                  class="text-xs font-semibold uppercase tracking-[0.22em] text-slate-400"
                >
                  Learning Paths
                </p>
                <p class="mt-2 max-w-[175px] text-sm leading-7 text-slate-500">
                  Pick a path and start building real front-end skills.
                </p>
              </div>

              <button
                *ngFor="let item of learningPath"
                type="button"
                (mouseenter)="onItemEnter(item)"
                (click)="onItemClick(item, $event)"
                class="group relative grid w-full grid-cols-[1fr_auto] items-center gap-3 rounded-2xl px-4 py-3 text-left transition-all duration-300 ease-out"
                [ngClass]="
                  activeItem?.label === item.label
                    ? 'bg-sky-50 text-sky-600 shadow-[inset_0_0_0_1px_rgba(14,165,233,0.08)]'
                    : 'text-slate-700 hover:bg-slate-50'
                "
              >
                <span
                  class="min-w-0 truncate pr-2 text-[15px] font-medium tracking-tight"
                >
                  {{ item.label }}
                </span>

                <span
                  *ngIf="item.status"
                  class="inline-flex h-7 min-w-[92px] items-center justify-center rounded-full px-3 text-[10px] font-semibold whitespace-nowrap"
                  [ngClass]="{
                    'bg-gray-100 text-gray-500': item.status === 'coming-soon',
                    'bg-green-100 text-green-600': item.status === 'available'
                  }"
                >
                  {{ item.status === 'available' ? 'Available' : 'Coming Soon' }}
                </span>

                <svg
                  *ngIf="item.status === 'available'"
                  class="absolute right-2 top-1/2 h-4 w-4 -translate-y-1/2 shrink-0 transition-all duration-300 ease-out"
                  [ngClass]="
                    activeItem?.label === item.label
                      ? 'translate-x-0 opacity-100 text-sky-500'
                      : '-translate-x-1 opacity-0 text-slate-300 group-hover:translate-x-0 group-hover:opacity-100'
                  "
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M9 5l7 7-7 7"
                  />
                </svg>
              </button>
            </div>

            <!-- Right panel -->
            <div
              class="w-[710px] overflow-hidden pb-6 transition-all duration-300 ease-out"
              [ngClass]="showRightPanel ? 'opacity-100' : 'opacity-0 pointer-events-none'"
            >
              <div
                class="min-w-[710px] px-4 pb-2 pt-4 transition-all duration-300 ease-out"
                [ngClass]="showRightPanel ? 'translate-x-0' : 'translate-x-3'"
              >
                <div class="px-2 pb-4">
                  <p
                    class="text-xs font-semibold uppercase tracking-[0.22em] text-slate-400"
                  >
                    For {{ activeItem?.label }}
                  </p>

                  <h3
                    class="mt-2 text-[24px] font-semibold tracking-tight text-slate-900"
                  >
                    {{ getPreviewTitle() }}
                  </h3>

                  <p class="mt-2 max-w-[500px] text-sm leading-7 text-slate-500">
                    {{ getPreviewDescription() }}
                  </p>
                </div>

                <div class="mt-2">
                  <!-- Available paths -->
                  <div *ngIf="showActionCards" class="grid gap-3">
                    <button
                      *ngFor="let action of learningPathActions"
                      type="button"
                      (click)="onActionClick(action)"
                      class="group w-full text-left transition-all duration-300 ease-out"
                      [ngClass]="action.featured ? 'col-span-2' : ''"
                    >
                      <div
                        class="flex min-h-[88px] items-center justify-between rounded-[22px] border px-4 py-2 shadow-[0_8px_24px_rgba(15,23,42,0.04)] transition-all duration-300 ease-out"
                        [ngClass]="getActionCardClass(action)"
                      >
                        <div class="flex min-w-0 items-center gap-3">
                          <div
                            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl text-sm font-semibold transition-all duration-300"
                            [ngClass]="getActionIconClass(action)"
                          >
                            {{ action.icon }}
                          </div>

                          <div class="min-w-0">
                            <div class="flex items-center gap-2">
                              <p
                                class="truncate text-[15px] font-semibold text-slate-800 transition-colors duration-300 group-hover:text-sky-600"
                              >
                                {{ action.label }}
                              </p>

                              <span
                                *ngIf="action.locked"
                                class="shrink-0 text-[13px]"
                                >🔒</span
                              >
                              <span
                                *ngIf="action.label === 'Interview Arena'"
                                class="shrink-0 text-[13px]"
                                >🏆</span
                              >
                            </div>

                            <p
                              class="mt-1 max-w-[250px] text-sm leading-6 text-slate-500"
                            >
                              {{ action.description }}
                            </p>
                          </div>
                        </div>

                        <span
                          class="ml-3 shrink-0 text-xl text-slate-300 transition-all duration-300 group-hover:translate-x-1 group-hover:text-sky-500"
                        >
                          →
                        </span>
                      </div>
                    </button>
                  </div>

                  <!-- Coming soon panel -->
                  <div
                    *ngIf="showComingSoonPanel"
                    class="rounded-[24px] border border-slate-200 bg-slate-50/70 px-6 py-5 shadow-[0_8px_24px_rgba(15,23,42,0.04)]"
                  >
                    <div class="flex items-center justify-between gap-6">
                      <div class="max-w-[320px]">
                        <div
                          class="mb-3 inline-flex rounded-full bg-white px-3 py-1 text-[11px] font-semibold tracking-[0.16em] text-slate-400 shadow-sm"
                        >
                          COMING SOON
                        </div>

                        <h4
                          class="text-[22px] font-semibold tracking-tight text-slate-900"
                        >
                          {{ activeItem?.label }} is on the way
                        </h4>

                        <p class="mt-2 text-sm text-slate-500">
                          Explore available paths for now.
                        </p>

                        <div class="mt-5 flex flex-wrap gap-3">
                          <button
                            type="button"
                            (click)="goToPath('Angular')"
                            class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:border-sky-200 hover:text-sky-600"
                          >
                            Angular
                          </button>
                        </div>
                      </div>

                      <div
                        #comingSoonVisual
                        class="relative hidden h-[220px] w-[220px] overflow-hidden rounded-[24px] border border-dashed border-slate-200 bg-white lg:block"
                      >
                        <div
                          class="absolute inset-0 bg-gradient-to-br from-sky-50 via-white to-amber-50"
                        ></div>

                        <div
                          #ring
                          class="absolute left-1/2 top-1/2 h-24 w-24 -translate-x-1/2 -translate-y-1/2 rounded-full border border-sky-100"
                        ></div>

                        <div
                          #core
                          class="absolute left-1/2 top-1/2 flex h-14 w-14 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-2xl bg-gradient-to-br from-sky-500 to-blue-500 text-white shadow-lg"
                        >
                          <span class="text-lg font-bold">&lt;/&gt;</span>
                        </div>

                        <div
                          #dot1
                          class="absolute left-[38px] top-[48px] h-3.5 w-3.5 rounded-full bg-sky-400 shadow"
                        ></div>
                        <div
                          #dot2
                          class="absolute right-[42px] top-[64px] h-3 w-3 rounded-full bg-yellow-400 shadow"
                        ></div>
                        <div
                          #dot3
                          class="absolute bottom-[44px] left-[54px] h-4 w-4 rounded-full bg-cyan-300 shadow"
                        ></div>

                        <p
                          #comingSoonText
                          class="absolute bottom-5 left-1/2 w-[140px] -translate-x-1/2 text-center text-xs font-medium text-slate-400"
                        >
                          Coming soon
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <button
        type="button"
        class="transition-colors duration-300 ease-out hover:text-sky-500"
      >
        Resources
      </button>

      <button
        type="button"
        class="rounded-xl border border-sky-300 px-5 py-2.5 text-slate-700 transition-all duration-300 ease-out hover:border-sky-400 hover:text-sky-500"
      >
        Log in
      </button>

      <app-button [label]="'Get Started Free'"></app-button>
    </div>
  </div>
</nav>
