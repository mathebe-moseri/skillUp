<app-container>
  
  <div class="absolute z-10 mt-2 select-none">
    <div class="flex items-center">
      <div class="relative w-12 h-10 
                bg-gradient-to-br from-yellow-400 to-sky-500 
                rounded-full flex items-center justify-center shadow-lg">
        <span class="text-white font-bold">&lt; // &gt;</span>
        <div class="absolute -top-1 -right-1 
                  w-4 h-4 bg-yellow-400 rounded-full">
        </div>
      </div>
      <div class="text-2xl font-extrabold tracking-tight">
        <span class="text-gray-400 rounded">skill</span>
        <span class="text-sky-500">Up</span>
      </div>
    </div>
  </div>

  <nav class="flex justify-end items-center h-16 ">
    <div class="flex gap-6 font-semibold text-gray-500 z-10">
      <div (mouseenter)="open()" (mouseleave)="close()">
        <button>
          Learning Path
            <app-dropdown [items]="learningPath" [open]="isLearningOpen" (itemSelect)="onSelect($event)">
            </app-dropdown>
        </button>
      </div>

      <button>Practice</button>
      <button>Resources</button>
      <button class="border border-sky-300 rounded-lg px-4">Log in</button>
      <app-button>Get Started Free</app-button>
    </div>
  </nav>

</app-container>
