<app-container>
  <div class="absolute z-10 mt-2 select-none">
    <div class="flex items-center gap-2">
      <div
        class="relative flex h-10 w-12 items-center justify-center rounded-full bg-gradient-to-br from-yellow-400 to-sky-500 shadow-lg">
        <span class="font-bold text-white">&lt; // &gt;</span>
        <div class="absolute -right-1 -top-1 h-4 w-4 rounded-full bg-yellow-400"></div>
      </div>

      <div class="text-2xl font-extrabold tracking-tight">
        <span class="rounded text-gray-400">skill</span>
        <span class="text-sky-500">Up</span>
      </div>
    </div>
  </div>

  <nav class="flex h-16 items-center justify-end">
    <div class="z-10 flex items-center gap-5 font-semibold text-gray-500">
      <div
        class="relative"
        (mouseenter)="cancelClose()"
        (mouseleave)="scheduleClose()"
      >
        <button
          type="button"
          (click)="toggleMenu($event)"
          class="flex items-center gap-2 rounded-xl px-3 py-2 text-[15px] font-semibold transition-all duration-300 ease-out hover:text-sky-500"
          [ngClass]="isOpen ? 'text-sky-500' : 'text-slate-600'"
        >
          <span>Learning Path</span>
          <app-dropdown [isOpen]="isOpen"></app-dropdown>
        </button>

<div
  *ngIf="isOpen"
  (mouseenter)="cancelClose()"
  (mouseleave)="scheduleClose()"
  (click)="$event.stopPropagation()"
  class="dropdown-shell absolute top-full mt-1 w-[980px] rounded-[28px] border border-slate-200/70 bg-white/95 px-3 pt-3 pb-6 backdrop-blur-2xl transition-all duration-300 ease-out"
>
  <div class="flex items-start">
    <!-- Left panel -->
    <div
      class="w-[235px] shrink-0 p-4 transition-all duration-300 ease-out"
      [ngClass]="showPreviewPanel ? 'border-r border-slate-100' : ''"
    >
      <div class="px-3 pb-3 pt-2">
        <p class="text-xs font-semibold uppercase tracking-[0.22em] text-slate-400">
          Learning Paths
        </p>
        <p class="mt-2 max-w-[175px] text-sm leading-7 text-slate-500">
          Pick a path and start building real front-end skills.
        </p>
      </div>

      <button
        *ngFor="let item of learningPath"
        type="button"
        (mouseenter)="onItemEnter(item)"
        (click)="onItemClick(item, $event)"
        class="group flex w-full items-center justify-between rounded-2xl px-4 py-2.5 text-left transition-all duration-300 ease-out"
        [ngClass]="
          activeItem?.label === item.label
            ? 'bg-sky-50 text-sky-600 shadow-[inset_0_0_0_1px_rgba(14,165,233,0.08)]'
            : 'text-slate-700 hover:bg-slate-50'
        "
      >
        <span class="text-[15px] font-medium tracking-tight">
          {{ item.label }}
        </span>

        <svg
          *ngIf="item.hasPreview"
          class="h-4 w-4 shrink-0 transition-all duration-300 ease-out"
          [ngClass]="
            activeItem?.label === item.label
              ? 'translate-x-0 opacity-100 text-sky-500'
              : '-translate-x-1 opacity-0 text-slate-300'
          "
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 5l7 7-7 7"
          />
        </svg>
      </button>
    </div>

    <!-- Right preview panel -->
    <div
      class="w-[710px] overflow-hidden pb-6 transition-all duration-300 ease-out"
      [ngClass]="
        showPreviewPanel
          ? 'opacity-100'
          : 'opacity-0 pointer-events-none'
      "
    >
      <div
        class="min-w-[710px] px-4 pb-2 pt-4 transition-all duration-300 ease-out"
        [ngClass]="
          showPreviewPanel
            ? 'translate-x-0'
            : 'translate-x-3'
        "
      >
        <div class="px-2 pb-4">
          <p class="text-xs font-semibold uppercase tracking-[0.22em] text-slate-400">
            For {{ activeItem?.label }}
          </p>

          <h3 class="mt-2 text-[24px] font-semibold tracking-tight text-slate-900">
            {{ getPreviewTitle() }}
          </h3>

          <p class="mt-2 max-w-[430px] text-sm leading-7 text-slate-500">
            {{ getPreviewDescription() }}
          </p>
        </div>

        <div class="grid gap-3 -m-2">
          <button
            *ngFor="let action of learningPathActions"
            type="button"
            (click)="onActionClick(action)"
            class="group w-full text-left transition-all duration-300 ease-out"
            [ngClass]="action.featured ? 'col-span-2' : ''"
          >
            <div
              class="flex min-h-[88px] items-center justify-between rounded-[22px] border px-4 py-2 shadow-[0_8px_24px_rgba(15,23,42,0.04)] transition-all duration-300 ease-out"
              [ngClass]="getActionCardClass(action)"
            >
              <div class="flex min-w-0 items-center gap-3">
                <div
                  class="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl text-sm font-semibold transition-all duration-300"
                  [ngClass]="getActionIconClass(action)"
                >
                  {{ action.icon }}
                </div>

                <div class="min-w-0">
                  <div class="flex items-center gap-2">
                    <p
                      class="truncate text-[15px] font-semibold text-slate-800 transition-colors duration-300 group-hover:text-sky-600"
                    >
                      {{ action.label }}
                    </p>

                    <span *ngIf="action.locked" class="shrink-0 text-[13px]">🔒</span>
                    <span *ngIf="action.label === 'Interview Arena'" class="shrink-0 text-[13px]">🏆</span>
                  </div>

                  <p class="mt-1 max-w-[250px] text-sm leading-6 text-slate-500">
                    {{ action.description }}
                  </p>
                </div>
              </div>

              <span
                class="ml-3 shrink-0 text-xl text-slate-300 transition-all duration-300 group-hover:translate-x-1 group-hover:text-sky-500"
              >
                →
              </span>
            </div>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
      </div>

      <button type="button" class="transition-colors duration-300 ease-out hover:text-sky-500">
        Practice
      </button>

      <button type="button" class="transition-colors duration-300 ease-out hover:text-sky-500">
        Resources
      </button>

      <button
        type="button"
        class="rounded-xl border border-sky-300 px-5 py-2.5 text-slate-700 transition-all duration-300 ease-out hover:border-sky-400 hover:text-sky-500"
      >
        Log in
      </button>

      <app-button [label]="'Get Started Free'"></app-button>
    </div>
  </nav>
</app-container>
