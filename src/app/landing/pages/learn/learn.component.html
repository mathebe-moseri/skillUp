<div class="">
  <app-nav />
</div>

<div>
  <div class="mx-auto max-w-7xl py-8">
    <section class="grid items-start gap-12 xl:grid-cols-[0.7fr_1.3fr]">

      <!-- LEFT -->
      <section class="p-6">
        <div class="concept-dropdown relative rounded-2xl border border-slate-200 bg-white shadow-sm">
          <button
            type="button"
            (click)="toggleConceptMenu()"
            class="flex w-full items-center justify-between rounded-2xl px-4 py-4 text-left transition hover:bg-slate-50"
          >
            <div>
              <p class="text-xl font-bold text-yellow-300">
                {{ selectedSubtopic || selectedConcept || 'Select a concept' }}
              </p>
              <p class="mt-2 text-xs text-slate-500">
                {{
                  selectedSubtopic
                    ? selectedConcept
                    : 'Choose a topic and expand its subtopics'
                }}
              </p>
            </div>

            <svg
              class="h-5 w-5 text-slate-500 transition-transform duration-300"
              [ngClass]="{ 'rotate-180': isConceptMenuOpen }"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              />
            </svg>
          </button>

          <div
            *ngIf="isConceptMenuOpen"
            class="absolute left-0 right-0 top-full z-30 mt-2 max-h-[520px] overflow-y-auto rounded-2xl border border-slate-200 bg-white p-3 shadow-2xl"
          >
            <div class="space-y-2">
              <!-- Decorators -->
              <div class="rounded-2xl border border-slate-200 bg-slate-50">
                <button
                  type="button"
                  (click)="selectConceptOnly('Decorators')"
                  class="flex w-full items-center justify-between px-4 py-3 text-left transition hover:bg-sky-50"
                >
                  <span class="text-sm font-semibold text-slate-800">Decorators</span>
                  <svg
                    class="h-4 w-4 text-slate-500 transition-transform duration-300"
                    [ngClass]="{ 'rotate-90': expandedConcept === 'Decorators' }"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    (click)="$event.stopPropagation(); toggleSubmenu('Decorators')"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M9 5l7 7-7 7"
                    />
                  </svg>
                </button>

                <div
                  class="overflow-hidden transition-all duration-300 ease-in-out"
                  [ngClass]="expandedConcept === 'Decorators' ? 'max-h-[420px]' : 'max-h-0'"
                >
                  <div class="space-y-1 px-3 pb-3">
                    <button
                      type="button"
                      *ngFor="let item of decoratorTopics"
                      (click)="selectSubtopic('Decorators', item)"
                      class="block w-full rounded-xl px-3 py-2 text-left text-sm text-slate-600 transition hover:bg-white hover:text-sky-700"
                    >
                      {{ item }}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-5 rounded-3xl bg-white p-5 shadow-2xl">
          <p class="text-xs font-bold uppercase tracking-wider text-sky-600">
            Concept Explanation
          </p>

          <h3 class="mt-2 text-sm font-extrabold text-gray-600">
            What you need to know about the
            <span class="underline">{{ selectedSubtopic || '@Input()' }}</span>
          </h3>

          <div class="min-h-[220px]">
            <p
              *ngFor="let paragraph of visibleParagraphs"
              class="mt-3 text-sm leading-6 text-slate-600"
            >
              {{ paragraph }}
            </p>
          </div>

          <button
            (click)="goToNextExplanation()"
            class="mt-5 flex w-full items-center justify-center gap-2 rounded-full bg-sky-300 px-4 py-2 text-sm font-bold text-white transition hover:scale-[1.02] hover:bg-sky-400"
          >
            Read more
            <span class="text-lg">→</span>
          </button>
        </div>
      </section>

      <!-- RIGHT -->
      <section class="relative overflow-hidden p-6">
        <div
          class="pointer-events-none absolute -right-16 -top-16 h-48 w-48 rounded-full blur-3xl"
        ></div>

        <div class="relative">
          <div class="mb-6 flex items-center gap-4">
            <div
              class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-sky-500 to-blue-600 text-white shadow-lg"
            >
              ▶
            </div>

            <div>
              <p class="text-xs font-bold uppercase tracking-[0.22em] text-sky-600">
                Concept Video
              </p>
              <h2 class="mt-1 text-2xl font-extrabold text-gray-600">
                How and when to use the &#64;Input() decorator?
              </h2>
            </div>
          </div>

          <div
            class="mt-6 flex aspect-video w-full items-center justify-center overflow-hidden rounded-[28px] bg-white shadow-lg shadow-sky-100"
          >
            <div class="text-center">
              <div
                class="mx-auto flex h-20 w-20 items-center justify-center rounded-full bg-white"
              >
                <span class="ml-1 text-3xl text-sky-600">▶</span>
              </div>
              <p class="mt-4 text-lg font-semibold text-slate-800">Video Lesson Space</p>
              <p class="mt-1 text-sm text-slate-500">
                Embed your Input decorator lesson here
              </p>
            </div>
          </div>
        </div>
      </section>
    </section>
  </div>
  <div class="mt-10">
  <app-practice />
  </div>
</div>
