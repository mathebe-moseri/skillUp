<div class="challenge-live" *ngIf="match && me as currentPlayer">
  <div class="topbar">
    <div>
      <h2>{{ match.task.title }}</h2>
      <p>{{ match.task.description }}</p>
    </div>

    <div class="status">
      <div>Time: {{ elapsedSeconds }}s</div>
      <div>Status: {{ match.status }}</div>
      <div *ngIf="opponent">
        Opponent: {{ opponent.displayName || opponent.realName || opponent.id }}
      </div>
    </div>
  </div>

  <div class="workspace">
    <aside class="files">
      <h3>Files</h3>

      <button
        type="button"
        *ngFor="let fileName of myFileNames"
        (click)="selectFile(fileName)"
        [class.active]="fileName === activeFileName">
        {{ fileName }}
      </button>
    </aside>

    <section class="editor-panel">
      <div class="editor-header">
        <span>{{ activeFileName || 'No file selected' }}</span>

        <div class="actions">
          <button type="button" (click)="runCode()">Run</button>
          <button type="button" (click)="submitCode()">Submit</button>
        </div>
      </div>

      <textarea
        class="editor"
        [value]="activeFileContent"
        (input)="updateCode($any($event.target).value)"
        spellcheck="false"
        autocapitalize="off"
        autocomplete="off"
        autocorrect="off">
      </textarea>
    </section>
  </div>
</div>

<div *ngIf="!match" class="empty-state">
  Loading match...
</div>
